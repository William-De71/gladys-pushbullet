name: Bug report
description: Something does not work as described in the documentation.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Never paste your Pushbullet access token or encryption password: the logs of the integration do not contain them, but check before posting. E-mail addresses are masked in the logs.
  - type: input
    id: gladys-version
    attributes:
      label: Gladys version
      description: Settings → System.
      placeholder: '5.1.1'
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: Integrations → Pushbullet → Supervision tab.
      placeholder: '0.1.0'
    validations:
      required: true
  - type: input
    id: account
    attributes:
      label: Pushbullet setup
      description: Free or Pro account, the kind of devices (Android, iPhone, browser…), which receptions are on (pushes, mirrored notifications), end-to-end encryption on or off. Never the token.
      placeholder: 'Free account, Android + Chrome, pushes received on, no encryption'
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Logs of the integration (Settings → Supervision). In developer mode, add the environment variable `DEBUG=gladys-integration-sdk` for the SDK debug logs, reproduce, then copy the lines. E-mail addresses are masked; hide the texts of your pushes and notifications if you wish.
      render: text
